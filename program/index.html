<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WhatNext | Game list</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;700&family=Space+Grotesk:wght@500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="myStyle.css">
</head>
<body>
    <main class="app-shell">
        <header class="page-header">
            <div>
                <p class="eyebrow">FRIENDS' GAME LIBRARY</p>
                <h1>What<span>Next</span>?</h1>
                <p class="intro">Keep the next game night moving. Flag the titles your group is ready to play.</p>
            </div>
            <div class="header-mark" aria-hidden="true">WN</div>
        </header>

        <div class="library-buttons" aria-label="Choose a friend's library">
            <button class="library-button" data-library="finn" type="button">Finn</button>
            <button class="library-button" data-library="henry" type="button">Henry</button>
            <button class="library-button" data-library="ify" type="button">Ify</button>
            <button class="library-button" data-library="jack" type="button">Jack</button>
            <button class="library-button" data-library="joe" type="button">Joe</button>
            <button class="library-button" data-library="john" type="button">John</button>
            <button class="library-button" data-library="juan" type="button">Juan</button>
            <button class="library-button" data-library="max" type="button">Max</button>
            <button class="library-button" data-library="sam" type="button">Sam</button>
        </div>
    </main>

    <script>
        document.querySelectorAll('[data-library]').forEach((button) => {
            button.addEventListener('click', () => {
                window.location.href = `libraries.html?owner=${button.dataset.library}`;
            });
        });
    </script>
</body>
</html>
